<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Dhyan Anil | Contact</title>
		<meta name="description" content="Get in touch with Dhyan Anil for video editing, web development, collaborations, or other inquiries." />
		<meta name="keywords" content="Dhyan Anil, dhyan anil, contact, email, video editing, web development" />

		<meta name="author" content="Dhyan Anil" />

		<link rel="icon" href="../images/ico/light/faviconLight48x48.ico" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="../images/ico/dark/faviconDark48x48.ico" media="(prefers-color-scheme: light)" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="/contact/style.css" />
	</head>

	<body>
		<header>
			<a id="navbarLogo" href="/">
				<img id="logoImage" src="" alt="Dhyan Anil's logo" />
			</a>

			<nav id="mainNavigation">
				<ul>
					<li><a href="/">Dhyan Anil</a></li>
					<li><a href="/contact/?source=contact">Contact</a></li>
				</ul>

				<button id="themeButton">
					<img id="themeImage" src="" alt="Toggle theme" />
				</button>

				<button id="menuButton">
					<img id="menuImage" src="" alt="Open menu" />
				</button>
			</nav>
		</header>

		<hr />

		<section id="mainPage">
			<div id="mainHeading">
				<span>Contact Me</span>
			</div>

			<div id="mainContent">
				<label for="emailInput">Email</label>
				<div class="fieldGroup">
					<input id="emailInput" type="email" placeholder="example@email.com" />
					<label for="messageInput">Message</label>
				</div>

				<div class="fieldGroup">
					<textarea id="messageInput" placeholder="Type your message..."></textarea>
					<button id="sendButton">Submit</button>
				</div>
			</div>

			<div id="mainResult"></div>
		</section>

		<footer>© 2026 Dhyan Anil</footer>

		<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
		<script src="/contact/script.js" defer></script>
	</body>
</html>
